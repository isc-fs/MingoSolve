# Other ways people write a variable's name, mapped to the registry name (data/formulas). Read by src/names.rs.
# An alias never shadows a registry name (a test enforces it). Spellings with a run of three letters or more
# (initial, friction, wheelbase) match in any case; shorter ones are physics symbols and match case-sensitively.
# Spellings that could mean several variables are listed under [ambiguous]: the engine asks instead of guessing.

[greek]
"μ" = "mu"
"µ" = "mu"
"ρ" = "rho"
"η" = "eta"
"ω" = "omega"
"τ" = "tau"
"α" = "alpha"
"φ" = "phi"
"σ" = "sigma"
"ε" = "eps"
"κ" = "kappa"
"γ" = "gamma"
"δ" = "delta"
"Δ" = "d"
"∆" = "d"

