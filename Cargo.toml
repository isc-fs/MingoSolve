[workspace]
# The `fsq` engine crate lives at the root (like can-flasher in MingoCAN); apps/mingosolve adds the Tauri app.
members = []
resolver = "2"

[package]
name = "fsq"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "ISC MingoSolve engine: equation solving with units for Formula Student quiz calculations."
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "fsq"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
roots = "0.0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
serde_json = "1"
