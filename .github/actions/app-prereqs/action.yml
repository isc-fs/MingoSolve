name: App prerequisites
description: >
  Rust with a build cache, Node with the frontend installed, the platform icons and the frontend bundle the Tauri
  crate embeds at compile time, and the WebKitGTK libraries on Linux.

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
    - shell: bash
      run: rustup show active-toolchain
    - uses: Swatinem/rust-cache@v2
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: apps/mingosolve/package-lock.json
    - shell: bash
      working-directory: apps/mingosolve
      run: |
        npm ci
        npx tauri icon src-tauri/icons/icon.png
        npm run build
