name: CI

# Every layer on every pull request: the engine, the app's command contract, the frontend, the end-to-end
# journeys in Chromium and WebKit, the Python fallback, and the app crate on macOS and Windows.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Engine and app commands (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-prereqs
      - uses: actions/checkout@v4
        with:
          repository: isc-fs/IFS-Tests
          path: ifs-tests
          sparse-checkout: data/fsquiz
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          FSQ_BANK: ${{ github.workspace }}/ifs-tests/data/fsquiz/bank.json

  platforms:
    name: Engine and app commands (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-prereqs
      - uses: actions/checkout@v4
        with:
          repository: isc-fs/IFS-Tests
          path: ifs-tests
          sparse-checkout: data/fsquiz
      - run: cargo test --workspace
        env:
          FSQ_BANK: ${{ github.workspace }}/ifs-tests/data/fsquiz/bank.json

  frontend:
    name: Frontend and end to end
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/mingosolve
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-prereqs
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/mingosolve/test-results/
          retention-days: 7

  python:
    name: Python fallback
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
